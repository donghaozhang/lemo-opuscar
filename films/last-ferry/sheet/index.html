<html><head><meta charset="utf-8"><title>model sheet</title>

</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { makeChar, CFG, POSES, Pen, drawAdult, drawChild, EXPR } from '../chars.js';
import { PX } from '../px.js';
import { portrait, PORTRAITS } from '../portraits.js';
const Q = new URLSearchParams(location.search), MODE = Q.get('m') || 'model';
const c = document.getElementById('c'), g = c.getContext('2d'); g.imageSmoothingEnabled = false;
await document.fonts.load("500 20px 'Noto Serif SC'");
function label(s, x, y) { g.fillStyle = '#e8dcc8'; g.font = "500 20px 'Noto Serif SC', Cinzel"; g.fillText(s, x, y); }

window.render = () => {
  g.imageSmoothingEnabled = false; g.fillStyle = '#1a1416'; g.fillRect(0, 0, 1920, 1080);
  if (MODE === 'model') {
    // row 1: every character at density 1, zoom 3 (wide-shot look); row 2: the heroes at density 3, zoom 1.2 (close-up look)
    let x = 20; label('density 1 ×3 (wide shots)', 20, 30);
    for (const [id, pid, fr] of [['lz', 'lz', 'idle0'], ['lz', 'lz', 'row1'], ['lz', 'lz', 'sit'], ['xs', 'xs', 'idle0'], ['xs', 'xs', 'sit'], ['mo', 'mo', 'w0'], ['br', 'br', 'idle0'], ['gr', 'gr', 'idle0'], ['gu1', 'gu', 'open'], ['gu2', 'gu', 'flip'], ['gu3', 'drum', 'd1'], ['ob', 'ob', 'idle0'], ['ow', 'ow', 'idle0'], ['goose', 'goose', 'honk'], ['goose', 'goose', 'flap0'], ['nurse', 'nurse', 'idle0'], ['k1', 'kid', 'w1'], ['k2', 'kid', 'idle0'], ['t3', 'town', 'cheer0']]) {
      const ch = makeChar(id, pid, 1); const i = ch.atlas.names.indexOf(fr), fw = ch.atlas.FW, fh = ch.atlas.FH;
      g.drawImage(ch.atlas.canvas, i * fw, 0, fw, fh, x, 50, fw * 3, fh * 3); label(id + ' ' + fr, x, 240); x += fw * 3 + 6;
    }
    x = 20; label('density 3 ×1.3 (close-ups)', 20, 290);
    for (const [id, pid, fr] of [['lz', 'lz', 'calm'], ['lz', 'lz', 'smile'], ['lz', 'lz', 'grave'], ['lz', 'lz', 'firm'], ['lz', 'lz', 'fear'], ['lz', 'lz', 'tender'], ['lz', 'lz', 'blow'], ['lz', 'lz', 'match'], ['lz', 'lz', 'cup'], ['lz', 'lz', 'rowHard1'], ['xs', 'xs', 'sitAsk'], ['xs', 'xs', 'fever'], ['xs', 'xs', 'hold'], ['mo', 'mo', 'plead'], ['br', 'br', 'toss'], ['ob', 'ob', 'ask']]) {
      const ch = makeChar(id, pid, 3); const i = ch.atlas.names.indexOf(fr), fw = ch.atlas.FW * 3, fh = ch.atlas.FH * 3;
      g.drawImage(ch.atlas.canvas, i * fw, 0, fw, fh, x, 310, fw * 1.3, fh * 1.3); label(fr, x, 550); x += fw * 1.3 + 4;
    }
    // walk / row cycles + the goose
    x = 20; label('cycles ×3: lz row0-3 · xs run w0-3 · mo run w0-3 · goose', 20, 590);
    const lz = makeChar('lz', 'lz', 1), xs = makeChar('xs', 'xs', 1), mo = makeChar('mo', 'mo', 1), go = makeChar('goose', 'goose', 1);
    for (const [ch, frs] of [[lz, ['row0', 'row1', 'row2', 'row3', 'w0', 'w1', 'w2', 'w3', 'rope0', 'kneel', 'wave0']], [xs, ['w0', 'w1', 'w2', 'w3', 'drop0', 'drop1', 'wave1']], [mo, ['w0', 'w1', 'w2', 'w3', 'plead']], [go, ['idle', 'honk', 'flap0', 'flap1', 'refuse', 'sit']]]) {
      for (const fr of frs) { const i = ch.atlas.names.indexOf(fr), fw = ch.atlas.FW, fh = ch.atlas.FH; g.drawImage(ch.atlas.canvas, i * fw, 0, fw, fh, x, 610, fw * 3, fh * 3); x += fw * 3 + 4; }
      x += 20;
    }
    x = 20; label('portraits ×2', 20, 820);

  } else {

    label('老周 expressions, density 3 ×1.6', 20, 30);
    let x = 20; const ex = Object.keys(EXPR);
    const lz = makeChar('lz', 'lz', 3, Object.fromEntries(ex.map(e => ['e_' + e, { expr: e }])));
    for (const e of ex) { const i = lz.atlas.names.indexOf('e_' + e), fw = 120, fh = 174; g.drawImage(lz.atlas.canvas, i * fw, 0, fw, 70, x, 50, fw * 1.6, 70 * 1.6); label(e, x, 180); x += fw * 1.6 - 60; }
    label('小石 expressions', 20, 230);
    x = 20; const xs = makeChar('xs', 'xs', 3, Object.fromEntries(ex.map(e => ['e_' + e, { expr: e }])));
    for (const e of ex) { const i = xs.atlas.names.indexOf('e_' + e), fw = 120; g.drawImage(xs.atlas.canvas, i * fw, 50, fw, 70, x, 250, fw * 1.6, 70 * 1.6); label(e, x, 380); x += fw * 1.6 - 60; }

    label('portraits ×3', 20, 600);
    x = 20; for (const k of PORTRAITS) { g.drawImage(portrait(k), x, 620, 288, 288); label(k, x, 930); x += 300; }
  }
};
window.READY = true;
</script></body></html>
